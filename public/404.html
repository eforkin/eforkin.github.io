<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Erik Forkin</title>
    <script>
      // SPA redirect for GitHub Pages
      // Stores the path in a query param and redirects to index.html
      // where a script restores it via history.replaceState
      var path = window.location.pathname + window.location.search;
      window.location.replace('/?p=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
